<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Market Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: research-desk website. Fixed left rail (sections + holdings grouped by how long Hamdhan holds them), wide reading column on the right; each holding is its own long page with a sticky section bar. Collapses to a top bar on narrow screens. */
:root{
  --bg:#f2f4f5; --surface:#ffffff; --raise:#f7f9fa; --ink:#111a20; --muted:#59656f; --faint:#8a949c; --line:#dde3e7; --soft:#eaeef1;
  --accent:#1846a3; --accent-ink:#ffffff; --accent-soft:#e6ecf9;
  --up:#137a47; --down:#bd3a2f; --amber:#a3670a; --watch:#59656f;
  --c-chip:#2a78d6; --c-grid:#d38b12; --c-cyber:#6250d6; --c-gold:#b8860b; --c-globe:#1b9a72; --c-delivery:#0f9d58; --c-soft:#c2477d; --c-macro:#4b5b6b; --c-plant:#e06a2c; --c-social:#3b6fd8; --c-optic:#0e8aa8;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --rail:252px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1216; --surface:#141b21; --raise:#18212a; --ink:#e8edf1; --muted:#9ba7b1; --faint:#6f7b85; --line:#25303a; --soft:#1c262f;
  --accent:#8eaeff; --accent-ink:#0b1630; --accent-soft:#1b2843;
  --up:#4fc888; --down:#ff7f73; --amber:#e3a83a; --watch:#9ba7b1;
  --c-chip:#5aa0f0; --c-grid:#eaa53a; --c-cyber:#9a8cf0; --c-gold:#d9aa3a; --c-globe:#3cc79a; --c-delivery:#3fc27f; --c-soft:#e1709f; --c-macro:#8fa1b3; --c-plant:#f08a52; --c-social:#6f9af0; --c-optic:#3cb6d2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1216; --surface:#141b21; --raise:#18212a; --ink:#e8edf1; --muted:#9ba7b1; --faint:#6f7b85; --line:#25303a; --soft:#1c262f;
  --accent:#8eaeff; --accent-ink:#0b1630; --accent-soft:#1b2843;
  --up:#4fc888; --down:#ff7f73; --amber:#e3a83a; --watch:#9ba7b1;
  --c-chip:#5aa0f0; --c-grid:#eaa53a; --c-cyber:#9a8cf0; --c-gold:#d9aa3a; --c-globe:#3cc79a; --c-delivery:#3fc27f; --c-soft:#e1709f; --c-macro:#8fa1b3; --c-plant:#f08a52; --c-social:#6f9af0; --c-optic:#3cb6d2;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pos{color:var(--up)} .neg{color:var(--down)} .flat{color:var(--muted)}

/* ---------- rail ---------- */
.rail{position:fixed;top:env(safe-area-inset-top,0px);bottom:0;left:0;width:var(--rail);background:var(--surface);border-right:1px solid var(--line);
  overflow-y:auto;padding:22px 14px 28px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;z-index:20}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-family:var(--f-display);font-size:1.55rem;font-weight:700;letter-spacing:-.01em;line-height:1.05}
.brand b span{color:var(--accent)}
.brand small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navgrp h6{margin:0 0 4px;padding:0 8px;font-size:.66rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.navlink{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;text-decoration:none;color:var(--ink);padding:7px 8px;border-radius:8px;font-size:.9rem}
.navlink:hover{background:var(--soft)}
.navlink[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navlink .t{display:flex;gap:8px;align-items:baseline;min-width:0}
.navlink .t b{font-family:var(--f-mono);font-weight:600;font-size:.8rem;flex:none;width:3.6em}
.navlink .t span{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navlink[aria-current="page"] .t span{color:var(--accent)}
.navlink .chg{font-family:var(--f-mono);font-size:.74rem}
.railnote{margin-top:auto;padding:0 8px;font-size:.72rem;color:var(--faint);line-height:1.45}

/* ---------- main ---------- */
main{margin-left:var(--rail);min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:28px max(28px,env(safe-area-inset-right,0px)) 72px 36px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:2.5rem;line-height:1.08;letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:1.6rem;line-height:1.15;margin:0;text-wrap:balance}
h3{font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.lede{font-size:1.06rem;color:var(--muted);max-width:68ch;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel>header span{font-size:.8rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi small{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--f-mono);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:.78rem;color:var(--muted)}
.note{font-size:.78rem;color:var(--muted);margin:0}
ul.list{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
ul.list li{line-height:1.5}

/* holdings table */
.tablewrap{overflow-x:auto}
table.hold{width:100%;border-collapse:collapse;font-size:.88rem}
table.hold th{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.hold th:first-child,table.hold td:first-child{text-align:left}
table.hold td{padding:10px;border-bottom:1px solid var(--soft);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.hold td:first-child{font-family:var(--f-body)}
table.hold tr.row{cursor:pointer}
table.hold tr.row:hover td{background:var(--raise)}
table.hold td a{text-decoration:none;color:var(--ink);display:flex;gap:10px;align-items:center}
table.hold td a b{font-family:var(--f-mono)}
table.hold td a span{color:var(--muted);font-size:.82rem}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:.72rem;font-weight:600;font-family:var(--f-body);border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.pill.long{color:var(--c-globe);border-color:currentColor}
.pill.years{color:var(--c-delivery);border-color:currentColor}
.pill.months{color:var(--amber);border-color:currentColor}
.pill.swing{color:var(--down);border-color:currentColor}
.pill.pie{color:var(--c-cyber);border-color:currentColor}

/* allocation bar */
.alloc{display:flex;height:16px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.alloc i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* art tiles */
.art{position:relative;border-radius:10px;overflow:hidden;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;width:100%}
.art svg{width:58%;height:auto;max-height:80%}
.art .lab{position:absolute;left:10px;bottom:8px;font-family:var(--f-mono);font-size:.7rem;font-weight:600;color:var(--c);letter-spacing:.04em}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* stories */
.stories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.story{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.story.lead{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.story.lead .art{aspect-ratio:auto;height:100%;min-height:260px;border-radius:0}
.story>.art{border-radius:0}
.story .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kicker{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.kicker .time{font-family:var(--f-mono);font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.story h4{font-family:var(--f-display);font-weight:600;font-size:1.3rem;line-height:1.22;margin:0;text-wrap:balance}
.story.lead h4{font-size:1.75rem}
.story p{margin:0}
.impacts{display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--soft);padding-top:10px}
.impacts .lbl{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.imp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:.88rem}
.tag{font-family:var(--f-mono);font-weight:600;font-size:.74rem;border-radius:6px;padding:1px 7px;white-space:nowrap;border:1px solid currentColor;line-height:1.55;text-decoration:none}
.tag.up{color:var(--up)} .tag.down{color:var(--down)} .tag.mixed{color:var(--amber)} .tag.watch{color:var(--watch)}
.imp sup{font-family:var(--f-mono);font-size:.68rem;color:var(--accent)}
.learn{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.86rem}
.learn b{color:var(--accent)}
.reads{display:flex;flex-direction:column;gap:5px;font-size:.82rem}
.reads a{text-decoration:none;font-weight:600;display:inline-flex;gap:6px;align-items:baseline}
.reads a:hover{text-decoration:underline}
.reads .n{font-family:var(--f-mono);color:var(--muted);font-weight:400}
.reads small{color:var(--muted);font-weight:400}

/* filters */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;height:34px;padding:0 14px;font-size:.85rem;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.chip.small{height:28px;padding:0 10px;font-size:.78rem;font-family:var(--f-mono)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;height:34px;padding:0 14px;font-size:.88rem;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.secthead{display:flex;align-items:baseline;gap:12px;margin-top:6px}
.secthead h2{font-size:1.35rem}
.secthead span{font-size:.82rem;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:30px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{font-family:var(--f-display);font-size:1.25rem;color:var(--ink)}

/* stock page */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:stretch}
.hero .who{display:flex;flex-direction:column;gap:10px;min-width:0}
.hero .tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hero .price{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hero .price b{font-family:var(--f-mono);font-size:2.3rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero .price span{font-family:var(--f-mono);font-size:1rem}
.hero .price small{font-size:.8rem;color:var(--muted)}
.hero .art{aspect-ratio:auto;min-height:200px;height:100%}
.callbox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.callbox small{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.callbox b{font-size:1.02rem}
.callbox p{margin:0;font-size:.9rem}
.secnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:10px 0;margin-block:-6px;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.secnav::-webkit-scrollbar{display:none}
.secnav button{border:0;background:transparent;border-radius:8px;padding:6px 11px;font-size:.84rem;font-weight:600;color:var(--muted);white-space:nowrap}
.secnav button:hover{background:var(--soft);color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fact{background:var(--surface);padding:11px 13px;display:flex;flex-direction:column;gap:3px;min-width:0}
.fact small{font-size:.68rem;color:var(--muted);letter-spacing:.04em}
.fact b{font-family:var(--f-mono);font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums}
.fact span{font-size:.74rem;color:var(--muted)}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.chart .gl{stroke:var(--soft);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-family:var(--f-mono);font-size:.76rem;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .1s}
.ruler{display:flex;flex-direction:column;gap:16px;padding:6px 0 4px}
.rrow{display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px;align-items:center}
.rrow>span{font-size:.82rem;color:var(--muted)}
.rtrack{position:relative;height:30px}
.rtrack .band{position:absolute;top:9px;height:12px;border-radius:6px}
.rtrack .mk{position:absolute;top:2px;height:26px;width:3px;border-radius:2px;transform:translateX(-50%)}
.rtrack .lb{position:absolute;top:30px;transform:translateX(-50%);font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.rtrack .now{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--ink)}
.ratings{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.ratings i{display:block;height:100%}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl{position:relative;padding:0 0 14px 18px}
.tl::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--down)}
.tl b{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);display:block}
.vtable{width:100%;border-collapse:collapse;font-size:.9rem}
.vtable td{padding:9px 6px;border-bottom:1px solid var(--soft)}
.vtable td:nth-child(2),.vtable td:nth-child(3){font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.vtable td:nth-child(3){color:var(--muted)}
.srclist{display:flex;flex-direction:column;gap:4px;font-size:.84rem;margin:0;padding:0;list-style:none;columns:2;column-gap:24px}
.srclist li{break-inside:avoid;padding:2px 0}
.srclist a{text-decoration:none}
.srclist a:hover{text-decoration:underline}
.foot{font-size:.76rem;color:var(--faint);border-top:1px solid var(--line);padding-top:14px}

/* top bar for narrow screens */
.topbar{display:none}
@media (max-width:980px){
  .rail{display:none}
  main{margin-left:0}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
    padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));gap:10px;align-items:center}
  .topbar b{font-family:var(--f-display);font-size:1.2rem;font-weight:700;flex:none}
  .topbar select{flex:1;min-width:0;font:inherit;font-size:.9rem;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 10px}
  .wrap{padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
  .secnav{top:calc(env(safe-area-inset-top,0px) + 59px)}
  .hero{grid-template-columns:1fr}.hero .art{min-height:150px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stories,.grid2,.grid3,.cols2{grid-template-columns:1fr}
  .story.lead{grid-template-columns:1fr}.story.lead .art{min-height:180px}
  h1{font-size:2rem}
  .srclist{columns:1}
  .rrow{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>


</head>
<body>
<aside class="rail" aria-label="Sections">
  <div class="brand"><b>Market <span>Desk</span></b><small id="railDate">Daily briefing</small></div>
  <nav class="navgrp" id="navMain"></nav>
  <nav class="navgrp" id="navHold"></nav>
  <p class="railnote">Updated each morning at about 6:35am UK. Research, not financial advice.</p>
</aside>

<div class="topbar"><b>Market Desk</b><select id="mnav" aria-label="Go to"></select></div>

<main><div class="wrap" id="view">
  <div class="empty"><b>Loading Market Desk</b>Your holdings, prices and the morning's news appear here.</div>
</div></main>

<script>
/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https:\/\//i.test(String(u||''))?String(u):null;
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pd=s=>{const[y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(Date.UTC(y,(m||1)-1,d||1))};
const nice=s=>{if(!s)return'';const d=pd(s);return `${DAYS[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`};
const short=s=>{const d=pd(s);return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`};
const isNum=v=>typeof v==='number'&&isFinite(v);
function money(v,ccy,dp){if(!isNum(v))return'N/A';if(ccy==='p')return v.toLocaleString('en-GB',{maximumFractionDigits:dp??1})+'p';
  const d=dp??(Math.abs(v)<20?2:Math.abs(v)<1000?2:0);return (ccy==='£'?'£':'$')+v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}

  if(s.kind!=='macro'&&t&&TICK_ART[t])return TICK_ART[t];

}

const ORDER=['NVDA','GOOGL','META','GRAB','VST','ADSK','FN','VWRP','ISPY','FGRD','SGLN'];
const groupOf=s=>s.horizon||'long';
function sorted(){return Object.values(stocks).sort((a,b)=>{const ia=ORDER.indexOf(a.ticker),ib=ORDER.indexOf(b.ticker);return (ia<0?99:ia)-(ib<0?99:ib)})}
const latest=()=>editions[0]?editions[0].data:null;
const fx=()=>{const e=latest();return (e&&isNum(e.gbpusd))?e.gbpusd:(isNum(stocks.GRAB?.snapshot?.gbpusd)?stocks.GRAB.snapshot.gbpusd:1.34)};
function lastClose(s){const h=s.history||[];return h.length?h[h.length-1]:null}
function curPrice(s){return isNum(s.price)?s.price:(lastClose(s)||{}).c}
function estValue(s){
  if(isNum(s.weight_pct))return s.weight_pct;
  const p=curPrice(s),sn=s.snapshot||{};
  if(!isNum(p))return sn.value_gbp;
  if(isNum(sn.value_gbp)&&isNum(sn.price)&&sn.price>0){const f=(s.ccy==='$'&&isNum(sn.gbpusd))?sn.gbpusd/fx():1;return sn.value_gbp*p/sn.price*f}
  if(isNum(s.units)&&s.ccy==='$')return s.units*p/fx();
  return sn.value_gbp;
}
function offHigh(s){const p=curPrice(s);return isNum(p)&&isNum(s.hi52)&&s.hi52>0?(p-s.hi52)/s.hi52*100:null}
function upside(s){const p=curPrice(s),t=s.targets||{};return isNum(p)&&isNum(t.avg)&&!t.stale?(t.avg-p)/p*100:null}

let chartN=0;
function priceChart(s){
  const h=(s.history||[]).filter(r=>isNum(r.c));
  if(h.length<2)return `<div class="empty"><b>Price history builds up daily</b>Each morning's close is added here.</div>`;
  const W=860,H=300,L=58,R=118,T=18,B=34,id='pc'+(chartN++);
  const vals=h.map(r=>r.c);let lo=Math.min(...vals),hi=Math.max(...vals);
  const t=s.targets||{};const extra=[];
  if(isNum(t.avg)&&!t.stale&&t.avg<=hi*1.6&&t.avg>=lo*0.6)extra.push(t.avg);
  if(isNum(s.hi52)&&s.hi52<=hi*1.45)extra.push(s.hi52);
  lo=Math.min(lo,...extra);hi=Math.max(hi,...extra);const pad=(hi-lo)*0.08||1;lo-=pad;hi+=pad;
  const x=i=>L+(W-L-R)*i/(h.length-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const line=h.map((r,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(r.c).toFixed(1)}`).join('');
  const area=line+`L${x(h.length-1).toFixed(1)} ${H-B}L${x(0)} ${H-B}Z`;
  const first=h[0].c,last=h[h.length-1].c,col=last>=first?'var(--up)':'var(--down)';
  let g='';for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${esc(money(v,s.ccy,s.ccy==='p'?0:undefined))}</text>`}
  let xl='',lastM=-1;h.forEach((r,i)=>{const d=pd(r.d);const m=d.getUTCMonth();if(m!==lastM&&i>0){xl+=`<text class="ax" x="${x(i)}" y="${H-B+18}" text-anchor="middle">${MON[m]}</text><line class="gl" x1="${x(i)}" x2="${x(i)}" y1="${H-B}" y2="${H-B+5}"/>`}lastM=m});
  let refs='';
  const ref=(v,lab,color)=>{if(!isNum(v)||v<lo||v>hi)return'';return `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${color}" stroke-width="1.5" stroke-dasharray="5 4"/><text class="ax" x="${W-R+8}" y="${y(v)+4}" style="fill:${color};font-weight:600">${esc(lab)}</text>`};
  if(isNum(t.avg)&&!t.stale)refs+=ref(t.avg,'Avg target '+money(t.avg,s.ccy,s.ccy==='p'?0:undefined),'var(--up)');
  if(isNum(s.hi52))refs+=ref(s.hi52,'52w high','var(--muted)');
  const lx=x(h.length-1),ly=y(last);
  const today=`<line x1="${lx}" x2="${lx}" y1="${T}" y2="${H-B}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="${lx}" cy="${ly}" r="5" fill="${col}" stroke="var(--surface)" stroke-width="2"/>
    <text class="ax" x="${lx+8}" y="${ly-10}" style="fill:var(--ink);font-weight:600">${esc(money(last,s.ccy))}</text>
    <text class="ax" x="${lx+8}" y="${ly+6}">${esc(short(h[h.length-1].d))} close</text>`;
  const above=isNum(t.avg)&&!t.stale&&t.avg>hi?`<text class="ax" x="${W-R+8}" y="${T+10}" style="fill:var(--up);font-weight:600">▲ Avg target</text><text class="ax" x="${W-R+8}" y="${T+24}" style="fill:var(--up)">${esc(money(t.avg,s.ccy,s.ccy==='p'?0:undefined))}</text>`:'';
  setTimeout(()=>hookChart(id,h,x,y,s.ccy),0);
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.ticker)} price from ${esc(short(h[0].d))} to ${esc(short(h[h.length-1].d))}">
    <defs><linearGradient id="${id}g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${g}${xl}<path d="${area}" fill="url(#${id}g)"/>${refs}${above}<path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>${today}
    <line class="cx" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" opacity="0"/><circle class="cd" r="4" fill="var(--ink)" opacity="0"/>
    <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" class="hit"/></svg><div class="tip"></div></div>`;
}
function hookChart(id,h,x,y,ccy){
  const el=$(id);if(!el)return;const svg=el.querySelector('svg'),hit=el.querySelector('.hit'),tip=el.querySelector('.tip'),cx=el.querySelector('.cx'),cd=el.querySelector('.cd');
  const move=ev=>{const r=svg.getBoundingClientRect();const sx=(ev.clientX-r.left)/r.width*860;let best=0,bd=1e9;h.forEach((p,i)=>{const d=Math.abs(x(i)-sx);if(d<bd){bd=d;best=i}});
    const px=x(best),py=y(h[best].c);cx.setAttribute('x1',px);cx.setAttribute('x2',px);cx.setAttribute('opacity','1');cd.setAttribute('cx',px);cd.setAttribute('cy',py);cd.setAttribute('opacity','1');
    tip.textContent=`${nice(h[best].d)} · ${money(h[best].c,ccy)}`;tip.style.left=(px/860*r.width)+'px';tip.style.top=(py/300*r.height)+'px';tip.style.opacity='1'};
  const out=()=>{tip.style.opacity='0';cx.setAttribute('opacity','0');cd.setAttribute('opacity','0')};
  hit.addEventListener('mousemove',move);hit.addEventListener('mouseleave',out);
  hit.addEventListener('touchstart',e=>move(e.touches[0]),{passive:true});hit.addEventListener('touchmove',e=>move(e.touches[0]),{passive:true});
}
function ruler(s){
  const p=curPrice(s),t=s.targets||{},fv=s.fair_value||{};
  const vals=[p,s.lo52,s.hi52,t.low,t.high,t.stale?null:t.avg,fv.value].filter(isNum);if(vals.length<2)return'';
  let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*0.05;lo-=pad;hi+=pad;const X=v=>((v-lo)/(hi-lo)*100).toFixed(2)+'%';
  const m=v=>money(v,s.ccy,s.ccy==='p'?0:undefined);
  const row=(label,a,b,color,marks)=>`<div class="rrow"><span>${label}</span><div class="rtrack">
    ${isNum(a)&&isNum(b)?`<div class="band" style="left:${X(a)};width:calc(${X(b)} - ${X(a)});background:color-mix(in srgb,${color} 35%,transparent)"></div><span class="lb" style="left:${X(a)}">${m(a)}</span><span class="lb" style="left:${X(b)}">${m(b)}</span>`:''}
    ${marks||''}<div class="now" style="left:${X(p)}"></div></div></div>`;
  const avgMk=isNum(t.avg)&&!t.stale?`<div class="mk" style="left:${X(t.avg)};background:var(--up)"></div><span class="lb" style="left:${X(t.avg)};top:-16px;color:var(--up);font-weight:600">avg ${m(t.avg)}</span>`:'';
  const fvMk=isNum(fv.value)?`<div class="mk" style="left:${X(fv.value)};background:var(--c-cyber)"></div><span class="lb" style="left:${X(fv.value)};color:var(--c-cyber);font-weight:600">${m(fv.value)}</span>`:'';
  return `<div class="ruler">
    <div class="rrow"><span></span><div class="rtrack" style="height:18px"><span class="lb" style="left:${X(p)};top:0;color:var(--ink);font-weight:700">Now ${m(p)}</span></div></div>
    ${row('52-week range',s.lo52,s.hi52,'var(--c-chip)')}
    ${row('Analyst targets',t.low,t.high,'var(--up)',avgMk)}
    ${isNum(fv.value)?row(esc(fv.label||'Fair value'),null,null,'',fvMk):''}
  </div>`;
}
function vbars(labels,values,{unit='',est=-1,fmt=v=>v.toFixed(1),signed=false}={}){
  const W=520,H=230,L=10,R=10,T=22,B=30,n=values.length;if(!n)return'';
  const mx=Math.max(0,...values),mn=Math.min(0,...values),rng=(mx-mn)||1,bw=(W-L-R)/n*0.62,step=(W-L-R)/n;
  const y=v=>T+(H-T-B)*(1-(v-mn)/rng),y0=y(0);
  const bars=values.map((v,i)=>{const cx=L+step*i+step/2,top=Math.min(y(v),y0),hh=Math.max(2,Math.abs(y(v)-y0));
    const c=signed?(v>=0?'var(--up)':'var(--down)'):(i>=est&&est>=0?'color-mix(in srgb,var(--c-chip) 45%,transparent)':'var(--c-chip)');
    return `<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${hh}" rx="3" fill="${c}"/><text class="ax" x="${cx}" y="${v>=0?top-6:top+hh+13}" text-anchor="middle" style="fill:var(--ink)">${esc(fmt(v))}</text><text class="ax" x="${cx}" y="${H-8}" text-anchor="middle">${esc(labels[i])}</text>`}).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)}"><line x1="${L}" x2="${W-R}" y1="${y0}" y2="${y0}" stroke="var(--line)"/>${bars}</svg></div>`;
}
function hbars(labels,vals,colors){
  const mx=Math.max(...vals)||1;
  return `<div style="display:flex;flex-direction:column;gap:9px">${labels.map((l,i)=>`<div style="display:grid;grid-template-columns:minmax(90px,38%) minmax(0,1fr) 3.4em;gap:10px;align-items:center;font-size:.86rem">
    <span style="color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l)}</span>
    <span style="height:12px;border-radius:4px;background:${colors?colors[i%colors.length]:'var(--c-chip)'};width:${(vals[i]/mx*100).toFixed(1)}%"></span>

    ${tot?`<div class="ratings"><i style="flex:${r.buy};background:var(--up)"></i><i style="flex:${r.hold||0.0001};background:var(--amber)"></i><i style="flex:${r.sell||0.0001};background:var(--down)"></i></div>
    <div class="legend"><span><i style="background:var(--up)"></i>Buy ${r.buy}</span><span><i style="background:var(--amber)"></i>Hold ${r.hold||0}</span><span><i style="background:var(--down)"></i>Sell ${r.sell||0}</span><span style="margin-left:auto"><b>${esc(r.label||'')}</b></span></div>`:`<p class="note">${esc(r.label||'No rating count available.')}</p>`}
    <div class="facts"><div class="fact"><small>Low target</small><b>${esc(money(t.low,s.ccy))}</b></div><div class="fact"><small>Average</small><b>${t.stale?'Stale':esc(money(t.avg,s.ccy))}</b></div><div class="fact"><small>High target</small><b>${esc(money(t.high,s.ccy))}</b></div>${s.fair_value&&isNum(s.fair_value.value)?`<div class="fact"><small>${esc(s.fair_value.label)}</small><b>${esc(money(s.fair_value.value,s.ccy))}</b></div>`:''}</div>
    ${(s.analyst_changes||[]).length?`<div><h3 style="margin-bottom:8px">Recent changes</h3><ul class="list">${s.analyst_changes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    ${t.note&&!t.stale?`<p class="note">${esc(t.note)}</p>`:''}</section>

  <section class="panel" id="sec-valuation"><header><h2>Is it cheap or expensive?</h2></header>
    <table class="vtable"><tbody>${(s.valuation||[]).map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${esc(x[2]||'')}</td></tr>`).join('')}</tbody></table>
    ${s.check?`<div class="learn"><b>Financial check.</b> ${esc(s.check)}</div>`:''}</section>

  <section class="cols2" id="sec-business">
    <div class="panel"><header><h2>${isEtf?'What it holds':'The backbone'}</h2><span>${esc((s.mix||{}).title||'')}</span></header>${s.mix?hbars(s.mix.labels,s.mix.pcts,PAL):''}<ul class="list">${(s.backbone||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="panel" id="sec-financials"><header><h2>${isEtf?'Performance':'Revenue'}</h2><span>${esc((s.rev||{}).title||'')}</span></header>
      ${s.rev?(s.rev.type==='seg'?hbars(s.rev.labels,s.rev.values,PAL):vbars(s.rev.labels,s.rev.values,{unit:s.rev.unit,est:s.rev.est_from??-1,fmt:v=>v>=100?Math.round(v)+'':v.toFixed(v<10?2:1)})):''}
      ${(s.financials||[]).length?`<table class="vtable"><tbody>${s.financials.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${esc(x[2]||'')}</td></tr>`).join('')}</tbody></table>`:''}</div>
  </section>

  <section class="panel" id="sec-record"><header><h2>Track record</h2><span>${esc((s.annual||{}).note||'calendar-year returns')}</span></header>
    ${s.annual&&s.annual.labels?vbars(s.annual.labels,s.annual.values,{signed:true,fmt:v=>(v>0?'+':'')+Math.round(v)+'%'}):'<p class="note">Not available yet.</p>'}
    ${(s.history_notes||[]).length?`<ul class="list">${s.history_notes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</section>

  <section class="cols2" id="sec-story">
    <div class="panel"><header><h2 class="pos">Why it could go up</h2></header><ul class="list">${(s.bull||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="panel"><header><h2 class="neg">Why it could go down</h2></header><ul class="list">${(s.bear||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  </section>
  ${(s.why_down||[]).length?`<section class="panel"><header><h2>Why it is below its high</h2></header><div class="timeline">${s.why_down.map(x=>`<div class="tl">${typeof x==='string'?esc(x):`<b>${esc(x.date||'')}</b>${esc(x.text)}${safeUrl(x.url)?` <a href="${esc(x.url)}" target="_blank" rel="noopener">Read ↗</a>`:''}`}</div>`).join('')}</div></section>`:''}
  ${(()=>{const m=upcoming().filter(c=>!(c.tickers||[]).includes(s.ticker)&&(c.affects||[]).some(a=>a.ticker===s.ticker));return m.length?`<section class="panel"><header><h2>Other events that touch ${esc(s.ticker)}</h2></header><ul class="list">${m.map(c=>`<li><b class="num">${esc(nice(c.date))}</b> · ${esc(c.event)}<div class="note">${esc((c.affects.find(a=>a.ticker===s.ticker)||{}).why||'')}</div></li>`).join('')}</ul></section>`:''})()}
  ${(s.events||[]).length?`<section class="panel"><header><h2>Coming up</h2></header><ul class="list">${s.events.map(x=>`<li><b class="num">${esc(nice(x.date))}</b>${x.time?' · '+esc(x.time):''} · ${esc(x.text)}${x.expected?`<div class="note">Expected: ${esc(x.expected)}</div>`:''}</li>`).join('')}</ul></section>`:''}

  <div class="secthead" id="sec-news"><h2>Latest news</h2><span>from the last ${editions.length} edition${editions.length===1?'':'s'}</span></div>
  ${news.length?`<div class="stories">${news.map(x=>storyHTML(x,false)).join('')}</div>`:`<div class="empty"><b>No stories yet</b>Stories mentioning ${esc(s.ticker)} collect here from each morning's briefing.</div>`}

  <section class="panel" id="sec-sources"><header><h2>Sources</h2><span>${s.updated?'figures last checked '+esc(s.updated):''}</span></header>
    <ul class="srclist">${(s.sources||[]).map(x=>{const u=safeUrl(x.url);return `<li>${u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(x.name)} ↗</a>`:esc(x.name)}</li>`}).join('')}</ul>
    <p class="foot">My read is an interpretation of these figures, not financial advice.</p></section>`;
}
function render(){
  const v=$('view');
  if(route==='overview')v.innerHTML=vOverview();
  else if(route==='news')v.innerHTML=vNews();
  else if(route==='calendar')v.innerHTML=vCalendar();
  else if(route==='learn')v.innerHTML=vLearn();
  else if(stocks[route])v.innerHTML=vStock(stocks[route]);
  else v.innerHTML=Object.keys(stocks).length?`<div class="empty"><b>Page not found</b><a href="#overview">Back to the overview</a></div>`:`<div class="empty"><b>Loading Market Desk</b>Your holdings and news appear here.</div>`;
  v.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{newsTab=b.dataset.tab;newsFilter='all';render()});
  v.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{newsFilter=b.dataset.f;render()});
  v.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{edIdx=+b.dataset.ed;render()});
  v.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{const el=$('sec-'+b.dataset.sec);if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-64,behavior:'smooth'})});
}

/* ================= boot (static site: reads JSON files) ================= */
const get=p=>fetch(p+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
go();
(async()=>{
  try{
    const idx=await get('data/index.json');
    const [ss,eds]=await Promise.all([
      Promise.all((idx.stocks||[]).map(t=>get('data/stocks/'+t+'.json').catch(()=>null))),
      Promise.all((idx.editions||[]).slice().sort().reverse().slice(0,21).map(d=>get('data/editions/'+d+'.json').then(x=>({id:d,data:x})).catch(()=>null)))]);
    stocks={};ss.filter(Boolean).forEach(x=>{stocks[x.ticker]=x});
    editions=eds.filter(Boolean);navHTML();render();
  }catch(e){$('view').innerHTML=`<div class="empty"><b>Couldn't load the data</b>Check your connection and refresh.</div>`}
})();
</script>

</body>
</html>
